<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Md. Minhazul Haque">
  <meta name="description" content="{{ site.subtitle }}">
  <link rel="icon" type="image/x-icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Global site tag (gtag.js) - Google Analytics (UA) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-57632461-8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'UA-57632461-8', { 'anonymize_ip': true });
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js"
    integrity="sha384-GNFwBvfVxBkLMJpYMOABq3c+d3KnQxudP/mGPkzpZSTYykLBNsZEnG2D9G/X/+7D" crossorigin="anonymous"></script>

  <title>{{ site.title }}</title>
</head>

<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a class="navbar-brand" href="#">
        <img src="favicon.png" alt="Logo">
        <span>{{ site.subtitle }}</span>
      </a>
      <a class="btn-github" href="https://github.com/mdminhazulhaque/awesome-bangla-parenting">
        <i class="bi bi-github"></i>
        <span>GitHub</span>
      </a>
    </div>
  </nav>

  <main class="container">
    <div class="grid">
      <div class="grid-sizer"></div>
      {% for category in site.data.parenting %}
      {% assign title = category[0] %}
      <div class="grid-item">
        <div class="category-card">
          <div class="category-header">
            <i class="bi bi-folder2-open"></i>
            <span>{{ title }}</span>
          </div>
          <div class="category-content">
            {% assign contents = category[1] %}
            {% for content in contents %}
            <a href="{{ content[1] }}" target="_blank" rel="noopener" class="resource-link">
              <span>{{ content[0] }}</span>
              <i class="bi bi-box-arrow-up-right icon-external"></i>
            </a>
            {% endfor %}
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>

  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var grid = document.querySelector('.grid');
      if (grid && typeof Masonry !== 'undefined') {
        new Masonry(grid, {
          percentPosition: true,
          itemSelector: '.grid-item',
          columnWidth: '.grid-sizer',
          gutter: 30
        });
      }
    });
  </script>
</body>

</html>
