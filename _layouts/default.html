<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
  <!-- Forced light mode: removed color-modes.js to prevent theme switching -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Md. Minhazul Haque">
    <meta name="description" content="{{ site.subtitle }}">
  <meta name="color-scheme" content="light">
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha384-GNFwBvfVxBkLMJpYMOABq3c+d3KnQxudP/mGPkzpZSTYykLBNsZEnG2D9G/X/+7D" crossorigin="anonymous" async></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
    <title>{{ site.title }}</title>
    <style>
      .bd-placeholder-img {
      font-size: 1.125rem;
      text-anchor: middle;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      }
      @media (min-width: 768px) {
      .bd-placeholder-img-lg {
      font-size: 3.5rem;
      }
      }
      .b-example-divider {
      width: 100%;
      height: 3rem;
      background-color: rgba(0, 0, 0, .1);
      border: solid rgba(0, 0, 0, .15);
      border-width: 1px 0;
      box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
      }
      .b-example-vr {
      flex-shrink: 0;
      width: 1.5rem;
      height: 100vh;
      }
      .bi {
      vertical-align: -.125em;
      fill: currentColor;
      }
      .nav-scroller {
      position: relative;
      z-index: 2;
      height: 2.75rem;
      overflow-y: hidden;
      }
      .nav-scroller .nav {
      display: flex;
      flex-wrap: nowrap;
      padding-bottom: 1rem;
      margin-top: -1px;
      overflow-x: auto;
      text-align: center;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      }
  /* Removed dark mode toggle styles */
    </style>
    <style>
      body { font-family: 'Noto Serif Bengali', serif !important; }
      /* Light mode enforced. Prevent accidental dark styling. */
      [data-bs-theme="dark"] { color-scheme: light; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="favicon.png" alt="" width="30" height="24">
                {{ site.subtitle }}
            </a>
            <a class="btn btn-dark" href="https://github.com/mdminhazulhaque/awesome-bangla-parenting">
                <i class="bi bi-github"></i> mdminhazulhaque/awesome-bangla-parenting
            </a>
        </div>
    </nav>
    <main class="container py-5">
      <div class="row" data-masonry='{"percentPosition": true }'>
        {% for category in site.data.parenting %}
        {% assign title = category[0] %}
        <div class="col-md-4 mb-4">
          <div class="list-group">
            <a href="#" class="list-group-item list-group-item-action active disabled d-flex align-items-center" aria-current="true">
              <i class="bi bi-folder2-open me-2"></i>
              <span>{{ title }}</span>
            </a>
            {% assign contents = category[1] %}
            {% for content in contents %}
            <a href="{{ content[1] }}" target="_blank" rel="noopener" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
              <span>{{ content[0] }}</span>
              <i class="bi bi-box-arrow-up-right small opacity-50"></i>
            </a>
            {% endfor %}
          </div>
        </div>
        {% endfor %}
      </div>
    </main>
  </body>
</html>
